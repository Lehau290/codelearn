<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CodeLearn C++ - Học lập trình C++ trực tuyến</title>

    <meta
        name="description"
        content="CodeLearn C++ - Nền tảng học lập trình C++ trực tuyến từ cơ bản đến thực hành"
    >

    <meta
        name="keywords"
        content="C++, học C++, lập trình C++, CodeLearn C++"
    >

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@700&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background:
                radial-gradient(circle at 15% 20%, rgba(164, 158, 242, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(199, 194, 250, 0.2) 0%, transparent 45%),
                #0a0815;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        .loading {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }

        .logo {
            width: 76px;
            height: 76px;
            border-radius: 22px;
            background: linear-gradient(135deg, #8b7cf8, #6351e8);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 28px;
            font-weight: 800;
            box-shadow: 0 20px 45px rgba(115, 100, 242, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.35);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); box-shadow: 0 25px 50px rgba(115, 100, 242, 0.55); }
        }

        h1 {
            color: #ffffff;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        p {
            color: #94a3b8;
            font-size: 15px;
            font-weight: 500;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255, 255, 255, 0.12);
            border-top-color: #8b7cf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <main class="loading">

        <div class="logo">
            C++
        </div>

        <h1>CodeLearn C++</h1>

        <p>Đang tải CodeLearn C++...</p>

        <div class="spinner"></div>

        <noscript>
            <p><a href="home.html" style="color: #847de8; text-decoration: underline;">Nhấn vào đây để vào Trang chủ</a></p>
        </noscript>

    </main>

    <!-- Storage script initializes default lessons and accounts -->
    <script src="js/storage.js"></script>
    <script>
        /*
         * Khởi động CodeLearn C++
         * Chuyển hướng thẳng tới Trang chủ (home.html)
         */
        window.location.replace("home.html");
    </script>

</body>
</html>
